services:
  - type: web
    name: sellerdesk
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: AUTO_SEED
        value: "true"
      - key: DB_CLIENT
        value: sqlite
      - key: SQLITE_FILE
        value: ./database/sellerdesk.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
